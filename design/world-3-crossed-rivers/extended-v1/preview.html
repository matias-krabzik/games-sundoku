const view=document.getElementById('viewport'),world=document.getElementById('world'),jump=document.getElementById('jump'),overview=document.getElementById('overview');
let mode='desktop',selected=1,scale=1,nodeSize=90,planes=[],pointer=[0,0];
const asset='review/assets/';
const svgImage=(path,box)=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+box+'" preserveAspectRatio="none"><image href="'+asset+path+'" width="1254" height="1254"/></svg>';
function tileDiv(t,kind){const e=document.createElement('div');e.className='tile';e.style.left=t.x+'px';const idx=DATA.tiles.indexOf(t);if(idx&&kind==='backdrop'){const overlap=2170-(t.x-DATA.tiles[idx-1].x);e.style.maskImage='linear-gradient(to right,transparent,black '+overlap+'px)';}const im=new Image();im.src=kind==='master'?'masters/'+t.file:'layers/'+(t.overrides?.[kind]||(t.id+'-'+kind+'.png'));im.alt='';e.append(im);return e;}
function cropImage(src,x,y,w,h,sx=0,sy=0,fit=false){const e=document.createElement('div');e.className='tile';Object.assign(e.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});const im=new Image();im.src=src;im.alt='';Object.assign(im.style,fit?{width:w+'px',height:h+'px'}:{left:-sx+'px',top:-sy+'px'});e.append(im);return e;}
function fillPlane(p,kind){if(kind==='terrain'||kind==='foreground'){const im=new Image();im.src='layers/assembled-'+kind+'.svg?v=3';im.alt='';Object.assign(im.style,{width:DATA.sourceSize.width+'px',height:DATA.sourceSize.height+'px',display:'block'});p.append(im);return;}for(const t of DATA.tiles)p.append(tileDiv(t,kind));}
function render(){world.replaceChildren();planes=[];const chosen=document.getElementById('layer').value;const kinds=chosen==='all'?['backdrop','terrain','foreground']:[chosen];
for(const kind of kinds){const p=document.createElement('div');p.className='plane';p.dataset.kind=kind;fillPlane(p,kind);p.style.width=DATA.sourceSize.width+'px';p.style.height=DATA.sourceSize.height+'px';p.style.transformOrigin='0 0';world.append(p);planes.push(p);}
view.classList.toggle('checker',chosen==='terrain'||chosen==='foreground');
const marks=document.createElement('div');marks.className='markers';marks.hidden=!document.getElementById('showMarkers').checked;
for(const n of DATA.nodes){const b=document.createElement('button');b.className='marker'+(n.level===selected?' selected':'');b.setAttribute('aria-label','Nivel '+n.level);b.dataset.level=n.level;
b.innerHTML='<span class="art">'+svgImage('marker-gold.png','115.368 94.05 1023.264 1042.074')+'</span><span class="digit">'+n.level+'</span>';
for(let i=0;i<3;i++){const star=document.createElement('span');star.className='star';const size=i===1?.34:.29;star.style.width=size*100+'%';star.style.height=size*100+'%';star.style.left=(.5+(i-1)*.4-size/2)*100+'%';star.style.top=(.5-(i===1?.68:.60)-size/2)*100+'%';star.innerHTML=svgImage('icons.png','22.572 149.226 384.978 376.2');b.append(star);}
b.onclick=()=>focusLevel(n.level);marks.append(b);}
world.append(marks);resize(false);}
function resize(recenter=true){let vh,vw;const room=Math.max(290,innerWidth-44);if(mode==='portrait'){vw=390;vh=640;}else if(mode==='landscape'){vw=844;vh=390;}else{vw=Math.min(1280,room);vh=Math.min(640,Math.max(380,innerHeight-300));}
view.style.width=Math.min(vw,room)+'px';view.style.height=vh+'px';
const minGap=Math.min(...DATA.nodes.slice(1).map((n,i)=>Math.hypot(n.x-DATA.nodes[i].x,n.y-DATA.nodes[i].y)));
const h=Math.max(vh,48*3*DATA.viewBox.height/minGap);scale=h/DATA.viewBox.height;const preferred=vh<520?68:Math.max(82,Math.min(106,vw*.24));nodeSize=Math.max(48,Math.min(preferred,minGap*scale/3));
world.style.width=(DATA.viewBox.width*scale)+'px';world.style.height=h+'px';
for(const p of planes)p.style.transform='translate('+(-DATA.viewBox.x*scale)+'px,'+(-DATA.viewBox.y*scale)+'px) scale('+scale+')';
for(const b of world.querySelectorAll('.marker')){const n=DATA.nodes[Number(b.dataset.level)-1];b.style.width=b.style.height=nodeSize+'px';b.style.fontSize=nodeSize*.49+'px';b.style.left=((n.x-DATA.viewBox.x)*scale-nodeSize/2)+'px';b.style.top=((n.y-DATA.viewBox.y)*scale-nodeSize/2)+'px';}
document.getElementById('metrics').textContent='· Separación mínima '+Math.round(minGap*scale)+' px · botón '+Math.round(nodeSize)+' px · '+(minGap*scale/nodeSize).toFixed(2)+'×';
const ow=document.getElementById('overviewWrap').clientWidth,os=ow/DATA.sourceSize.width;overview.style.transform='scale('+os+')';document.getElementById('overviewWrap').style.height=(724*os)+'px';if(recenter)focusLevel(selected,false);}
function focusLevel(n,smooth=false){selected=Math.max(1,Math.min(30,n));const p=DATA.nodes[selected-1];document.getElementById('selected').textContent='Nivel '+selected+' de 30 · '+DATA.tiles.find(t=>t.id===p.tile).name;jump.value=selected;for(const b of world.querySelectorAll('.marker'))b.classList.toggle('selected',Number(b.dataset.level)===selected);view.scrollTo({left:(p.x-DATA.viewBox.x)*scale-view.clientWidth/2,top:0,behavior:smooth?'smooth':'auto'});}
for(let n=1;n<=30;n++){const o=document.createElement('option');o.value=n;o.textContent='Nivel '+n;jump.append(o);}jump.onchange=()=>focusLevel(Number(jump.value));document.getElementById('previous').onclick=()=>focusLevel(selected-1);document.getElementById('next').onclick=()=>focusLevel(selected+1);
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;for(const other of document.querySelectorAll('[data-mode]'))other.setAttribute('aria-pressed',String(other===b));resize();};
document.getElementById('showMarkers').onchange=render;document.getElementById('layer').onchange=render;addEventListener('resize',()=>resize());
overview.style.width=DATA.sourceSize.width+'px';overview.style.height='724px';for(const kind of ['backdrop','terrain','foreground']){const p=document.createElement('div');p.className='plane';fillPlane(p,kind);overview.append(p);}for(const n of DATA.nodes){const d=document.createElement('span');d.className='dot';d.style.left=n.x+'px';d.style.top=n.y+'px';overview.append(d);}document.getElementById('overviewWrap').onclick=e=>{const x=(e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.clientWidth*DATA.sourceSize.width;focusLevel(DATA.nodes.reduce((a,b)=>Math.abs(a.x-x)<Math.abs(b.x-x)?a:b).level);};
view.onpointermove=e=>{const r=view.getBoundingClientRect();pointer=[(e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1];};view.onpointerleave=()=>pointer=[0,0];
function animate(){const enabled=document.getElementById('motion').checked&&!matchMedia('(prefers-reduced-motion:reduce)').matches;for(const p of planes){const f=p.dataset.kind==='backdrop'?-4:p.dataset.kind==='foreground'?5:0;const dx=enabled?pointer[0]*f:0,dy=enabled?pointer[1]*f*.4:0;p.style.transform='translate('+(-DATA.viewBox.x*scale+dx)+'px,'+(-DATA.viewBox.y*scale+dy)+'px) scale('+scale+')';}requestAnimationFrame(animate);}const initialLevel=Math.max(1,Math.min(30,Number(new URLSearchParams(location.search).get('level'))||1));render();focusLevel(initialLevel,false);animate();
